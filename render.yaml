# Render Blueprint — deploys Nimbus Do + PostgreSQL + builds the frontend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nimbusdo
    runtime: node
    repo: https://github.com/sidhvikdaram-source/task_manager.git
    branch: main
    plan: free
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm run render-build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OIDC_ISSUER_URL
        value: https://accounts.google.com
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CANVAS_BASE_URL
        value: https://fisd.instructure.com
      - key: CANVAS_INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: CANVAS_CLIENT_ID
        sync: false
      - key: CANVAS_CLIENT_SECRET
        sync: false
      - key: CANVAS_REDIRECT_URI
        sync: false

databases:
  - name: task-manager-db
    plan: free
    region: oregon
