# Render Blueprint — deploys API server + PostgreSQL + builds frontend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: task-manager
    runtime: node
    repo: https://github.com/sidhvikdaram-source/task_manager.git
    branch: main
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run render-build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OIDC_ISSUER_URL
        value: https://accounts.google.com

databases:
  - name: task-manager-db
    plan: free
    region: oregon